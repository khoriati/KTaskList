name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: swift build + swift test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Versões
        run: |
          sw_vers
          swift --version
      - name: Verificar ambiente
        run: scripts/check-env.sh
      - name: Compilar
        run: swift build
      - name: Testar
        run: swift test
      - name: Bundle release
        run: scripts/build-app.sh
